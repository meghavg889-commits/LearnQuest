<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LearnQuest - Quest</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header class="navbar">

    <div class="logo">
        🧠 LearnQuest
    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="dashboard.html">
            Dashboard
        </a>

    </nav>


    <div class="nav-streak">
        🔥 <span id="gameStreak">0</span>
    </div>

</header>



<main class="home-container">


    <div class="dashboard-header">

        <p class="welcome-text">
            🎯 YOUR LEARNING QUEST
        </p>


        <h1 id="gameTopic">
            Loading...
        </h1>

    </div>



    <div class="progress-container">

        <div class="progress-bar">

            <div
                class="progress-fill"
                id="progressFill">
            </div>

        </div>

    </div>



    <section class="game-card">


        <div class="game-header">

            <span
                class="question-number"
                id="questionNumber">
            </span>


            <span class="xp-display">

                ⭐ XP:
                <span id="gameXP">
                    0
                </span>

            </span>

        </div>



        <h2
            class="question"
            id="questionText">

            Loading question...

        </h2>



        <div
            class="options"
            id="options">

        </div>



        <div
            id="feedback"
            class="feedback">

        </div>



        <button
            id="nextButton"
            class="next-button"
            onclick="nextQuestion()"
            style="display:none;">

            Next Question →

        </button>


    </section>


</main>



<script src="data.js"></script>
<script src="script.js"></script>


</body>

</html>
